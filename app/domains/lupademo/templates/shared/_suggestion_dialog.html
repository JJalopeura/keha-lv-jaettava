<dialog class="suggestion-dialog" data-suggestion-dialog aria-labelledby="suggestion-dialog-title">
  <div class="suggestion-dialog__header">
    <div>
      <p class="section-kicker">AI-ehdotus</p>
      <h2 id="suggestion-dialog-title" data-dialog-field>Ehdotuksen tarkistus</h2>
    </div>
    <button type="button" class="secondary compact" data-dialog-close>Sulje</button>
  </div>
  <div class="suggestion-dialog__body">
    <p class="suggestion-dialog__confidence" data-dialog-confidence></p>
    <p data-dialog-rationale></p>
    <details class="evidence-disclosure suggestion-dialog__evidence">
      <summary data-dialog-evidence-summary>Mihin tämä perustuu?</summary>
      <div class="suggestion-dialog__sources" data-dialog-source></div>
    </details>
    <form method="post" data-dialog-accept>
      <input type="hidden" name="field_id" data-dialog-field-id>
      <label>AI-ehdotus<textarea name="edited_value" rows="4" data-dialog-value></textarea></label>
      <div class="suggestion-dialog__actions">
        <button>Hyväksy ehdotus</button>
        <button type="button" class="secondary" data-dialog-reject>Hylkää</button>
      </div>
    </form>
    <section class="suggestion-dialog__common-data" data-dialog-common-data hidden>
      <h3>Yhteinen tieto</h3>
      <p class="suggestion-dialog__common-data-intro" data-dialog-common-intro></p>
      <dl class="suggestion-dialog__common-data-values">
        <div><dt>LV:n yhteinen tieto</dt><dd data-dialog-common-lv></dd></div>
        <div><dt>Tämän hakemuksen arvo</dt><dd data-dialog-common-app></dd></div>
      </dl>
      <div class="suggestion-dialog__actions suggestion-dialog__common-data-actions">
        <form method="post" data-dialog-common-form>
          <input type="hidden" name="field_id" data-dialog-common-field-id>
          <input type="hidden" name="redirect_to" value="">
          <button type="submit" class="secondary compact" name="action" value="keep" data-dialog-common-keep>Eroavaisuus on ok — pidä erillään</button>
          <button type="submit" class="secondary compact" name="action" value="pull" data-dialog-common-pull>Päivitä kentän arvo LV:n arvolla</button>
          <button type="submit" class="secondary compact" name="action" value="push" data-dialog-common-push>Päivitä kentän arvo LV:n yhteisiin tietoihin</button>
        </form>
      </div>
    </section>
  </div>
</dialog>
<script>
(function () {
  var dialog = document.querySelector("[data-suggestion-dialog]");
  if (!dialog || !dialog.showModal) return;
  var acceptForm = dialog.querySelector("[data-dialog-accept]");
  var rejectButton = dialog.querySelector("[data-dialog-reject]");
  var closeButton = dialog.querySelector("[data-dialog-close]");
  var field = dialog.querySelector("[data-dialog-field]");
  var confidence = dialog.querySelector("[data-dialog-confidence]");
  var evidenceSummary = dialog.querySelector("[data-dialog-evidence-summary]");
  var rationale = dialog.querySelector("[data-dialog-rationale]");
  var source = dialog.querySelector("[data-dialog-source]");
  var value = dialog.querySelector("[data-dialog-value]");
  var fieldId = dialog.querySelector("[data-dialog-field-id]");
  var reject = dialog.querySelector("[data-dialog-reject]");
  var commonSection = dialog.querySelector("[data-dialog-common-data]");
  var commonIntro = dialog.querySelector("[data-dialog-common-intro]");
  var commonLv = dialog.querySelector("[data-dialog-common-lv]");
  var commonApp = dialog.querySelector("[data-dialog-common-app]");
  var commonForm = dialog.querySelector("[data-dialog-common-form]");
  var commonFieldId = dialog.querySelector("[data-dialog-common-field-id]");
  var commonRedirect = commonForm ? commonForm.querySelector("input[name='redirect_to']") : null;
  var activeButton;
  var activePayload;

  function close() { dialog.close(); activeButton = null; activePayload = null; }

  // A suggestion is a "no source support" placeholder when the model could not
  // infer a real value (e.g. Azure returns "Ei ilmoitettu" for an empty field
  // with no source material). Detect it so we don't present a confident
  // percentage for a value that is really just "this field is empty".
  function isNoSourceSupport(payload) {
    var value = String(payload.suggested_value || "").trim();
    if (!value) return true;
    if (value === "Ei ilmoitettu") return true;
    if (/^Täydennä kenttä /.test(value)) return true;
    var warnings = payload.warnings || [];
    return warnings.some(function (w) {
      return /ei (voitu|voida)|ei löytynyt|ei ole varsinainen|ei ole annettu/i.test(String(w));
    });
  }

  document.querySelectorAll("[data-suggestion-open]").forEach(function (button) {
    button.addEventListener("click", function () {
      activeButton = button;
      activePayload = JSON.parse(button.dataset.suggestionPayload || "{}");
      field.textContent = activePayload.field_label || "Ehdotuksen tarkistus";
      var confidenceValue = parseFloat(activePayload.confidence);
      var isFallback = Boolean(activePayload.fallback_used);
      var noSource = isNoSourceSupport(activePayload);
      if (noSource) {
        confidence.textContent = "Ei voitu täyttää automaattisesti";
        confidence.className = "suggestion-dialog__confidence suggestion-dialog__confidence--warn";
      } else {
        confidence.className = "suggestion-dialog__confidence";
        confidence.textContent = isFallback ? "Paikallinen AI-simulaatio" : "Arvioitu lähdetuki " + (Number.isFinite(confidenceValue) ? Math.round(confidenceValue * 100) + " %" : "-");
      }
      rationale.textContent = noSource
        ? "Lähdeaineistosta ei löytynyt tietoa tälle kentälle, joten sitä ei voitu täyttää automaattisesti. Täydennä kenttä käsin ennen lähettämistä."
        : (activePayload.rationale || "Ehdotukselle ei ole erillistä perustelua.");
      evidenceSummary.textContent = isFallback ? "Miten simulaatio muodostui?" : "Mihin tämä perustuu?";
      var refs = activePayload.evidence_refs || [];
      source.replaceChildren();
      if (isFallback) {
        var simulation = document.createElement("p");
        simulation.className = "muted";
        simulation.textContent = "Tämä on paikallinen AI-simulaatio. Ehdotus ei perustu tunnistettuun lähdekatkelmaan.";
        source.appendChild(simulation);
      } else if (noSource) {
        var noSourceNote = document.createElement("p");
        noSourceNote.className = "muted";
        noSourceNote.textContent = "Tämä kenttä vaatii hakijan täydennyksen — tekoäly ei voi päätellä arvoa annetusta aineistosta.";
        source.appendChild(noSourceNote);
      } else if (refs.length) {
        refs.forEach(function (ref) {
          var line = document.createElement("div");
          line.className = "evidence-line";
          var title = document.createElement("strong");
          title.textContent = ref.title || "Lähde";
          line.appendChild(title);
          if (ref.locator) {
            var locator = document.createElement("small");
            locator.textContent = ref.locator + (ref.confidence ? " · arvioitu lähdetuki " + Math.round(Number(ref.confidence) * 100) + " %" : "");
            line.appendChild(locator);
          }
          if (ref.quote) {
            var quote = document.createElement("p");
            quote.textContent = ref.quote;
            line.appendChild(quote);
          }
          source.appendChild(line);
        });
      } else {
        var empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "Lähdeviitettä ei ole saatavilla.";
        source.appendChild(empty);
      }
      value.value = activePayload.suggested_value || "";
      fieldId.value = activePayload.accept_field_id || "";
      acceptForm.action = activePayload.accept_url || "";
      reject.hidden = !activePayload.reject_url;
      // Shared-data discrepancy section (wayfinder T3): shown only when the
      // payload carries common-data context and the values actually differ.
      var common = activePayload.common_data || null;
      if (common && common.is_common_field && common.differs) {
        commonSection.hidden = false;
        commonFieldId.value = activePayload.field_id;
        commonRedirect.value = window.location.pathname + window.location.search;
        commonLv.textContent = common.lv_value || "Ei arvoa";
        commonApp.textContent = common.app_value || "Ei arvoa";
        commonIntro.textContent = "Tämä kenttä on asiointikokonaisuuden yhteinen tieto, ja sen arvo eroaa LV:n yhteisistä tiedoista. Valitse, miten toimit.";
      } else {
        commonSection.hidden = true;
      }
      dialog.showModal();
      value.focus();
    });
  });

  acceptForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var body = new URLSearchParams(new FormData(acceptForm));
    fetch(acceptForm.action, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body })
      .then(function (response) { if (!response.ok) throw new Error("HTTP " + response.status); return response; })
      .then(function () {
        var input = activePayload && document.querySelector("[name='" + CSS.escape(activePayload.field_id) + "']");
        if (input) input.value = value.value;
        if (activeButton) {
          var inline = activeButton.closest("[data-inline-suggestion]");
          if (inline) inline.remove();
        }
        close();
        if (!document.querySelector("[data-inline-suggestion]")) window.location.reload();
      })
      .catch(function () {});
  });

  rejectButton.addEventListener("click", function () {
    if (!activePayload || !activePayload.reject_url) return;
    fetch(activePayload.reject_url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: activePayload.accept_field_id ? new URLSearchParams({ field_id: activePayload.accept_field_id }) : undefined })
      .then(function (response) { if (!response.ok) throw new Error("HTTP " + response.status); })
      .then(function () {
        if (activeButton) {
          var inline = activeButton.closest("[data-inline-suggestion]");
          if (inline) inline.remove();
        }
        close();
        window.location.reload();
      })
      .catch(function () {});
  });

  closeButton.addEventListener("click", close);
  dialog.addEventListener("click", function (event) { if (event.target === dialog) close(); });
})();
</script>
